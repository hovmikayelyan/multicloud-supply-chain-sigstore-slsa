name: supply-chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Everything is keyless: no long-lived cloud keys or signing keys exist.
permissions:
  contents: read

env:
  # Set these as repository variables (Settings > Secrets and variables > Variables)
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}          # e.g. europe-west1
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GAR_REPO: ${{ vars.GAR_REPO }}                  # Artifact Registry repo name
  AWS_REGION: ${{ vars.AWS_REGION }}              # e.g. eu-west-1
  ECR_REPO: ${{ vars.ECR_REPO }}                  # ECR repository name
  IMAGE_NAME: sample-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token -> cloud auth + Fulcio keyless cert
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      gar_image: ${{ steps.names.outputs.gar_image }}
      ecr_image: ${{ steps.names.outputs.ecr_image }}
    steps:
      - uses: actions/checkout@v4

      # --- Cloud auth via OIDC federation (no static credentials) -------------
      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSH_SA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.auth_token }}

      - id: names
        run: |
          echo "gar_image=${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT}/${GAR_REPO}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${{ steps.ecr.outputs.registry }}/${ECR_REPO}" >> "$GITHUB_OUTPUT"

      # --- Build once, push the same digest to both registries ---------------
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          provenance: false     # provenance comes from the SLSA generator job below
          sbom: false           # we generate the SBOM explicitly with syft
          tags: |
            ${{ steps.names.outputs.gar_image }}:${{ github.sha }}
            ${{ steps.names.outputs.ecr_image }}:${{ github.sha }}

      # --- SBOM (CycloneDX) ---------------------------------------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.names.outputs.gar_image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # --- Keyless signing: OIDC -> Fulcio cert -> signature -> Rekor entry --
      - uses: sigstore/cosign-installer@v3
      - name: Sign images (by digest, keyless)
        run: |
          for img in "${{ steps.names.outputs.gar_image }}" "${{ steps.names.outputs.ecr_image }}"; do
            cosign sign --yes "${img}@${{ steps.build.outputs.digest }}"
            cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${img}@${{ steps.build.outputs.digest }}"
          done

      # --- SLSA provenance (v1 predicate) attested keyless -------------------
      # Generated by the build job itself => SLSA Build L2. For L3 move this into the
      # isolated slsa-github-generator reusable workflow (see docs/slsa.md).
      - name: Attest SLSA provenance
        run: |
          jq -n \
            --arg wf "https://github.com/${{ github.workflow_ref }}" \
            --arg repo "${{ github.server_url }}/${{ github.repository }}" \
            --arg sha "${{ github.sha }}" --arg ref "${{ github.ref }}" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            '{buildDefinition:{buildType:"https://actions.github.io/buildtypes/workflow/v1",
                externalParameters:{workflow:{ref:$ref,repository:$repo,path:$wf}},
                resolvedDependencies:[{uri:("git+"+$repo+"@"+$ref),digest:{gitCommit:$sha}}]},
              runDetails:{builder:{id:"https://github.com/actions/runner/github-hosted"},
                metadata:{invocationId:$run}}}' > provenance.json
          for img in "${{ steps.names.outputs.gar_image }}" "${{ steps.names.outputs.ecr_image }}"; do
            cosign attest --yes --type slsaprovenance1 --predicate provenance.json "${img}@${{ steps.build.outputs.digest }}"
          done

      # --- Verify in both clouds, capture evidence ---------------------------
      - name: Verify signatures + record Rekor UUID
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          ISSUER: https://token.actions.githubusercontent.com
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p evidence
          for pair in "gar:${{ steps.names.outputs.gar_image }}" "ecr:${{ steps.names.outputs.ecr_image }}"; do
            cloud="${pair%%:*}"; img="${pair#*:}"
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${img}@${DIGEST}" | tee "evidence/cosign-verify-${cloud}.json"
            cosign verify-attestation --type cyclonedx \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${img}@${DIGEST}" > "evidence/cosign-verify-attestation-${cloud}.json"
            cosign verify-attestation --type slsaprovenance1 \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${img}@${DIGEST}" > "evidence/cosign-verify-provenance-${cloud}.json"
            idx=$(jq -r '.[0].optional.Bundle.Payload.logIndex' "evidence/cosign-verify-${cloud}.json")
            uuid=$(curl -fsS "https://rekor.sigstore.dev/api/v1/log/entries?logIndex=${idx}" | jq -r 'keys[0]')
            echo "${cloud}: logIndex=${idx} uuid=${uuid} https://search.sigstore.dev/?logIndex=${idx}" | tee -a evidence/rekor.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
